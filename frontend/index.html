<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Autómatas</title>
    
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="cuerpo_pagina">

   
    <header class="barra_superior">
        
      
        <div class="caja_logo_y_titulo">
            <button id="boton_abrir_menu" class="boton_menu_icono">
                ☰
            </button>
            <span class="insignia_universidad">UMG</span>
            <span class="texto_titulo_proyecto">Simulador de Autómatas</span>
        </div>

    
        <div class="caja_boton_integrantes">
            <button id="boton_mostrar_integrantes" class="boton_integrantes">
                👥 Integrantes
            </button>
        </div>

    </header>
    
    <div id="fondo_oscuro" class="fondo_oscuro_menu ocultar"></div>


    <aside id="menu_lateral" class="menu_lateral menu_cerrado">

        
        <div class="cabecera_menu">
            <span class="texto_menu_titulo">Navegacion</span>
            <button id="boton_cerrar_menu" class="boton_cerrar">✕</button>
        </div>

      
        <nav class="caja_enlaces_menu">
            <button class="boton_seccion" data-vista="vista_inicio">🏠 Inicio</button>

            <div class="separador_menu">MODULO AUTÓMATAS</div>
            <button class="boton_seccion" data-vista="vista_crear">⚙️ Crear y Simular</button>
            <button class="boton_seccion" data-vista="vista_convertir">🔄 Conversión AFN a AFD</button>
            <button class="boton_seccion" data-vista="vista_minimizar">📉 Minimización AFD</button>

            <div class="separador_menu">ENTREGA 2</div>
            <button class="boton_seccion" data-vista="vista_regex">🔤 Expresiones Regulares</button>
        </nav>

       
        <div class="pie_menu">
            <span>Ingenieria en Sistemas UMG</span>
        </div>

    </aside>
   
    <main class="caja_contenido_principal">
    </main>

</body>
</html>

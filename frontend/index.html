<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Autómatas</title>
    <!-- Vinculamos nuestro archivo de diseño externo -->
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="cuerpo_pagina">

    <!-- CABECERA PRINCIPAL -->
    <header class="barra_superior">
        
        <!-- Caja izquierda: botón de menú y título -->
        <div class="caja_logo_y_titulo">
            <button id="boton_abrir_menu" class="boton_menu_icono">
                ☰
            </button>
            <span class="insignia_universidad">UMG</span>
            <span class="texto_titulo_proyecto">Simulador de Autómatas</span>
        </div>

        <!-- Caja derecha: botón para ver integrantes -->
        <div class="caja_boton_integrantes">
            <button id="boton_mostrar_integrantes" class="boton_integrantes">
                👥 Integrantes
            </button>
        </div>

    </header>

    <!-- Por ahora dejamos el cuerpo vacío para enfocarnos solo en la barra -->
    <main class="caja_contenido_principal">
    </main>

</body>
</html>
